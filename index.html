// ---------- Scoring ----------
function avgWithFood(b) {
if (b.disqualified) return null;
const vals = [b.vibe, b.value, b.service, b.food, b.drinks].filter(v => v !== null && v !== "" && !isNaN(v));
if (vals.length < 5) return null;
return vals.reduce((a, c) => a + Number(c), 0) / vals.length;
}
function avgWithoutFood(b) {
if (b.disqualified) return null;
const vals = [b.vibe, b.value, b.service, b.drinks].filter(v => v !== null && v !== "" && !isNaN(v));
if (vals.length < 4) return null;
return vals.reduce((a, c) => a + Number(c), 0) / vals.length;
}
function fmt(n) {
return n === null || n === undefined || isNaN(n) ? "—" : Number(n).toFixed(2);
}

// ---------- Helpers ----------
function safeParse(text, isArray) {
const cleaned = (text || "").replace(/```json|```/g, "").trim();
try { return JSON.parse(cleaned); } catch(e) {}
const re = isArray ? /\[[\s\S]*\]/ : /\{[\s\S]*\}/;
const m = cleaned.match(re);
if (m) { try { return JSON.parse(m[0]); } catch(e) {} }
return null;
}
function displayDescription(value) {
if (typeof value !== "string") return "";
const parsed = safeParse(value, false);
return parsed && !Array.isArray(parsed) && typeof parsed.description === "string"
? parsed.description.trim()
: value.trim();
}

// ---------- Gemini (used only for write-up flavor text, never for existence) ----------
const geminiCache = {};
async function callGemini(prompt, barId, forceRefresh) {
const key = barId || prompt;
if (!forceRefresh && geminiCache[key]) return geminiCache[key];
const controller = new AbortController();
const timeoutId = setTimeout(() => controller.abort(), 10000);
let response;
try {
response = await fetch("/api/gemini", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ prompt, barId, forceRefresh: !!forceRefresh }),
signal: controller.signal,
});
} catch(e) {
clearTimeout(timeoutId);
console.error("[gemini] request failed", e);
return null;
}
clearTimeout(timeoutId);
if (!response) return null;
if (!response.ok) {
const errText = await response.text().catch(() => "");
console.error(`[gemini] ${response.status} for barId=${barId || "(none)"}`, errText);
return null;
}
let data;
try {
data = await response.json();
} catch(e) {
console.error("[gemini] response was not valid JSON", e);
return null;
}
if (!data.result) {
console.warn(`[gemini] no result field for barId=${barId || "(none)"}`, data);
}
if (data.result) geminiCache[key] = data.result;
return data.result || null;
}

// ---------- Google Places (source of truth for existence + location) ----------
const SURPRISE_VIBES = ["cozy neighborhood", "lively cocktail", "classic dive", "speakeasy", "rooftop", "wine", "beer hall", "late night", "live music"];

// Session-only cache: repeating the same vibe search (or the same manual
// lookup) within PLACES_CACHE_TTL_MS reuses the prior response instead of
// re-billing the Places API. Cleared on page reload — bars you've already
// saved never hit this path again anyway, since verification only happens
// once, at add-time, and the result is persisted to Firestore.
const placesCache = new Map();
const PLACES_CACHE_TTL_MS = 10 * 60 * 1000; // 10 minutes

async function fetchPlaces(query, { neighborhood, address, ballerMode, exploreMode, limit, noCache } = {}) {
const cacheKey = JSON.stringify({ query, neighborhood, address, ballerMode: !!ballerMode, exploreMode: !!exploreMode, limit: limit || 5 });
if (!noCache) {
const cached = placesCache.get(cacheKey);
if (cached && Date.now() - cached.time < PLACES_CACHE_TTL_MS) return cached.results;
}
try {
const response = await fetch("/api/places", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ query, neighborhood, address, ballerMode: !!ballerMode, exploreMode: !!exploreMode, limit: limit || 5 }),
});
const results = await response.json();
const safe = Array.isArray(results) ? results : [];
if (!noCache) placesCache.set(cacheKey, { time: Date.now(), results: safe });
return safe;
} catch(e) { return []; }
}

async function fetchBarSuggestions(vibeQuery, groupSize, excludeNames, ballerMode, exploreMode) {
const results = await fetchPlaces(vibeQuery || "great bar", { ballerMode, exploreMode, limit: 8 });
return results.filter(r => !excludeNames.includes(r.name)).slice(0, 4);
}

async function fetchRandomBar(groupSize, excludeNames, ballerMode, exploreMode) {
const vibe = SURPRISE_VIBES[Math.floor(Math.random() * SURPRISE_VIBES.length)];
// noCache: true — Surprise Us should actually surprise you, not replay a cached batch.
const results = await fetchPlaces(vibe, { ballerMode, exploreMode, limit: 10, noCache: true });
const fresh = results.filter(r => !excludeNames.includes(r.name));
if (fresh.length === 0) return null;
return fresh[Math.floor(Math.random() * fresh.length)];
}

const emptyVisitedForm = { id:null, name:"", vibe:"", value:"", service:"", food:"", drinks:"", bathroomBonus:"", notes:"" };

// ---------- App ----------
function App() {
const [bars, setBars] = useState(null);

const [groupSize, setGroupSizeState] = useState(4);

const [fitsGroupOnly, setFitsGroupOnly] = useState(false);
const [ballerMode, setBallerMode] = useState(false);
const [exploreMode, setExploreMode] = useState(false);
const [searchResults, setSearchResults] = useState([]);
const [searching, setSearching] = useState(false);
const [searchDone, setSearchDone] = useState(false);
const [fetchingIds, setFetchingIds] = useState(new Set());
const [enrichingNames, setEnrichingNames] = useState(() => new Set());
const [showInfo, setShowInfo] = useState(false);
const [visitedSuggestion, setVisitedSuggestion] = useState(null);
const [placesModal, setPlacesModal] = useState(null);
const [showVisitedNamePrompt, setShowVisitedNamePrompt] = useState(false);
const [visitedNameInput, setVisitedNameInput] = useState("");
const [visitedHoodInput, setVisitedHoodInput] = useState("");

const docRef = db.collection(DOC_PATH.collection).doc(DOC_PATH.doc);

useEffect(() => {
const unsub = docRef.onSnapshot((snap) => {
if (snap.exists) {
const data = snap.data();
setBars(data.bars || []);
if (data.groupSize) setGroupSizeState(data.groupSize);
} else {
docRef.set({ bars: seedBars, groupSize: 4 }).catch(() => setConnError(true));
setBars(seedBars);
}
setLoading(false);
}, (err) => { console.error(err); setConnError(true); setBars(seedBars); setLoading(false); });
return () => unsub();
// eslint-disable-next-line
}, []);

const persist = useCallback((next) => {
setBars(next);
return docRef.set({ bars: next }, { merge: true })
.then(() => setSaveError(false))
.catch(() => setSaveError(true));
// eslint-disable-next-line
}, []);

const persistGroup = useCallback((n) => {

docRef.set({ groupSize: n }, { merge: true }).catch(() => {});
// eslint-disable-next-line
}, []);

const updateBar = useCallback((id, patch) => {
setBars((prev) => {
const next = prev.map(b => b.id === id ? { ...b, ...patch } : b);
docRef.set({ bars: next }, { merge: true }).catch(() => setSaveError(true));
return next;
});
// eslint-disable-next-line
}, []);

const runDetailsFetch = useCallback((bar, forceRefresh) => {
setFetchingIds(s => new Set(s).add(bar.id));
const prompt = `You are a NYC bar description writer.\n\nThe bar "${bar.name}" located at "${bar.address || bar.neighborhood || "New York City"}" has already been verified as a real, currently open business via Google Places.\n\nUsing only what you know about this specific venue, return ONLY JSON:\n\n{"description":"two to three sentences covering vibe, drink style, and notable characteristics","tags":["3 to 5 short lowercase vibe words"],"happyHour":"short string or null","neighborhood":"short neighborhood name","capacityHint":0}\n\nRules:\n- Do NOT invent or rename the business.\n- If you have no reliable information, set description to an empty string.\n- Do not include a mapsLink field.`;
callGemini(prompt, bar.id, forceRefresh).then((data) => {
const patch = data ? { ...data, detailsFetched: true } : null;
if (patch) updateBar(bar.id, patch);
setFetchingIds(s => { const n = new Set(s); n.delete(bar.id); return n; });
});
}, [updateBar]);

useEffect(() => {
if (!bars) return;
bars.forEach(bar => {
if (!bar.detailsFetched && !fetchingIds.has(bar.id)) runDetailsFetch(bar);
});
// eslint-disable-next-line
}, [bars]);

function startManualAdd(type) {
if (type === "visited") {
setVisitedSuggestion(null);
setVisitedForm(emptyVisitedForm);
setShowVisitedNamePrompt(true);
} else {
setWishForm(emptyWishForm);
setShowWishForm(true);
}
}

async function startPlacesLookup(suggestion) {
setPlacesModal({ suggestion, results: [], searching: true });
try {
const results = await fetchPlaces(suggestion.name, { neighborhood: suggestion.neighborhood || "", address: suggestion.address || "", limit: 5 });
setPlacesModal({ suggestion, results, searching: false });
} catch(e) {
setPlacesModal({ suggestion, results: [], searching: false });
}
}

function confirmPlaceSelection(placeResult) {
const merged = { ...placesModal.suggestion, ...placeResult };
// Always preserve description/tags/neighborhood from the original suggestion
// (Places results only have name/address/lat/lng/placeId/mapsLink, so these would be lost otherwise)
merged.description = placesModal.suggestion.description || "";
merged.tags = placesModal.suggestion.tags || [];
merged.neighborhood = placesModal.suggestion.neighborhood || "";
merged.happyHour = placesModal.suggestion.happyHour || "";
merged.capacityHint = placesModal.suggestion.capacityHint || null;

if (placesModal.suggestion._placeIntent === "visited") {
setVisitedSuggestion(merged);
setVisitedForm({ ...emptyVisitedForm, name: merged.name });
setPlacesModal(null);
setShowVisitedForm(true);
} else {
addSuggestionToWishlist(merged);
setWishForm(emptyWishForm);
setPlacesModal(null);
}
}

const visited = useMemo(() => (bars || []).filter(b => b.status === "visited"), [bars]);
const toTry = useMemo(() => (bars || []).filter(b => b.status === "to-try"), [bars]);

const filteredVisited = useMemo(() => {
const q = search.trim().toLowerCase();
let list = visited.filter(b => {
if (!q) return true;
return b.name.toLowerCase().includes(q)
|| (b.neighborhood || "").toLowerCase().includes(q)
|| (b.notes || "").toLowerCase().includes(q)
|| (b.tags || []).some(t => t.toLowerCase().includes(q));
});
list.sort((a, b) => {
if (!!a.disqualified !== !!b.disqualified) return a.disqualified ? 1 : -1;
const av = foodMode === "with" ? avgWithFood(a) : avgWithoutFood(a);
const bv = foodMode === "with" ? avgWithFood(b) : avgWithoutFood(b);
return (bv || 0) - (av || 0);
});
return list;
}, [visited, search, foodMode]);

const filteredToTry = useMemo(() => {
return toTry.filter(b => {
if (fitsGroupOnly && b.capacity && Number(b.capacity) < groupSize) return false;
return true;
});
}, [toTry, fitsGroupOnly, groupSize]);

// Fills in a search/surprise result's description, tags, happyHour, and
// neighborhood in place via Gemini, once its existence is already confirmed
// by Places. Ephemeral — nothing here is persisted unless the user adds the
// bar, at which point the same fields carry over via addSuggestionToWishlist.
//
// Deliberately called WITHOUT a barId: api/gemini.js only does its Firestore
// bar lookup/caching when barId is present, and 404s if that id isn't an
// existing saved bar — which a fresh search result never is. Omitting barId
// routes it through the plain "generate and return, no Firestore" path.
const enrichSearchResult = useCallback((result) => {
setEnrichingNames(s => new Set(s).add(result.name));
const prompt = `You are a NYC bar description writer.\n\nThe bar "${result.name}" located at "${result.address || result.neighborhood || "New York City"}" has already been verified as a real, currently open business via Google Places.\n\nUsing only what you know about this specific venue, return ONLY a single JSON object (not an array):\n\n{"description":"two to three sentences covering vibe, drink style, and notable characteristics","tags":["3 to 5 short lowercase vibe words"],"happyHour":"short string or null","neighborhood":"short neighborhood name"}\n\nRules:\n- Do NOT invent or rename the business.\n- If you have no reliable information, set description to an empty string.`;
callGemini(prompt, null, false).then((data) => {
// Defensive: the server returns an array for multi-suggestion calls, so
// unwrap just in case Gemini ever ignores the "single object" instruction.
const info = Array.isArray(data) ? data[0] : data;
if (info) {
setSearchResults(prev => prev.map(r => r.name === result.name ? {
...r,
description: info.description || r.description,
tags: (info.tags && info.tags.length) ? info.tags : r.tags,
happyHour: info.happyHour || r.happyHour,
neighborhood: info.neighborhood || r.neighborhood,
} : r));
}
setEnrichingNames(s => { const n = new Set(s); n.delete(result.name); return n; });
});
}, []);

async function runSearch() {
setSearchResults([]); setSearching(true); setSearchDone(false);
const exclude = [...new Set([...(bars || []).map(b => b.name), ...seenNames])];
const results = await fetchBarSuggestions(vibeQuery, groupSize, exclude, ballerMode, exploreMode);
// Google doesn't expose venue capacity, so this only filters bars that already
// have a capacity set from a prior manual edit; new Places results pass through.
const fitFiltered = fitsGroupOnly ? results.filter(r => !r.capacityHint || r.capacityHint >= groupSize) : results;
setSearchResults(fitFiltered); setSearching(false); setSearchDone(true);
if (fitFiltered.length > 0) {
setSeenNames(prev => new Set([...prev, ...fitFiltered.map(r => r.name)]));
fitFiltered.forEach(r => enrichSearchResult(r));
}
}

async function runRandomSearch() {
setSearchResults([]); setSearching(true); setSearchDone(false);
const exclude = [...new Set([...(bars || []).map(b => b.name), ...seenNames])];
const pick = await fetchRandomBar(groupSize, exclude, ballerMode, exploreMode);
setSearchResults(pick ? [pick] : []);
setSearching(false); setSearchDone(true);
if (pick) {
setSeenNames(prev => new Set([...prev, pick.name]));
enrichSearchResult(pick);
}
