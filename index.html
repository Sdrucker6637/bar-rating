const DOC_PATH = { collection: "tourDeAlcoholism", doc: "sharedList" };

// ---------- Scoring ----------
function avgWithFood(b) {
  if (b.disqualified) return null;
  const vals = [b.vibe, b.value, b.service, b.food, b.drinks].filter(v => v !== null && v !== "" && !isNaN(v));
  if (vals.length < 5) return null;
  return vals.reduce((a, c) => a + Number(c), 0) / vals.length;
}
function avgWithoutFood(b) {
  if (b.disqualified) return null;
  const vals = [b.vibe, b.value, b.service, b.drinks].filter(v => v !== null && v !== "" && !isNaN(v));
  if (vals.length < 4) return null;
  return vals.reduce((a, c) => a + Number(c), 0) / vals.length;
}
function fmt(n) {
  return n === null || n === undefined || isNaN(n) ? "\u2014" : Number(n).toFixed(2);
}

// ---------- Helpers ----------
function safeParse(text, isArray) {
  const cleaned = (text || "").replace(/```json|```/g, "").trim();
  try { return JSON.parse(cleaned); } catch(e) {}
  const re = isArray ? /\[[\s\S]*\]/ : /\{[\s\S]*\}/;
  const m = cleaned.match(re);
  if (m) { try { return JSON.parse(m[0]); } catch(e) {} }
  return null;
}
function displayDescription(value) {
  if (typeof value !== "string") return "";
  const parsed = safeParse(value, false);
  return parsed && !Array.isArray(parsed) && typeof parsed.description === "string"
    ? parsed.description.trim()
    : value.trim();
}

// ---------- Gemini ----------
const geminiCache = {};
async function callGemini(prompt, barId, forceRefresh) {
  const key = barId || prompt;
  if (!forceRefresh && geminiCache[key]) return geminiCache[key];

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 10000);
  let response;
  try {
    response = await fetch("/api/gemini", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, barId, forceRefresh: !!forceRefresh }),
      signal: controller.signal,
    });
  } catch(e) {
    // fetch threw (network error, abort, etc.) — clear timeout and bail
    clearTimeout(timeoutId);
    return null;
  }
  clearTimeout(timeoutId);
  if (!response) return null;
  const data = await response.json();
  if (data.result) geminiCache[key] = data.result;
  return data.result || null;
}

function buildConstraints(ballerMode, exploreMode) {
  const price = ballerMode
    ? "Price range: anything goes, including upscale $$$-$$$$ spots \u2014 don't hold back."
    : "Price range: keep it affordable \u2014 $ to $$ only, nothing pricier.";
  const distance = exploreMode
    ? "Distance: no limit \u2014 further out is fine, even if it's a bit of a trek."
    : "Distance: keep it realistic \u2014 roughly within a 40-minute transit ride of Manhattan.";
  return price + " " + distance;
}

async function fetchBarSuggestions(vibeQuery, groupSize, excludeNames, ballerMode, exploreMode) {
  const constraints = buildConstraints(ballerMode, exploreMode);
  const prompt = `You are a concierge with live web search. Suggest 4 real, currently open bars in New York City matching this vibe request: "${vibeQuery || "a great night out"}". They should comfortably work for a group of about ${groupSize} people. ${constraints} Do not suggest any of these bars we already know: ${excludeNames.join(", ") || "none"}. Respond with ONLY raw JSON, no markdown fences, no commentary: an array of up to 4 objects, each in exactly this shape:
{"name":"string","neighborhood":"short neighborhood name","description":"two sentences covering vibe, price range ($ $$ $$$ $$$$), and location","tags":["3 to 5 short lowercase vibe words"],"happyHour":"short string or null","capacityHint":0,"address":"full street address, city, state"}`;
  try {
    const result = await callGemini(prompt, null, true);
    return Array.isArray(result) ? result : [];
  } catch(e) { return []; }
}

async function fetchRandomBar(groupSize, excludeNames, ballerMode, exploreMode) {
  const constraints = buildConstraints(ballerMode, exploreMode);
  const prompt = `You are a concierge with live web search. Pick exactly one real, currently open bar in New York City as a fun surprise recommendation \u2014 any vibe, your choice. It should comfortably work for a group of about ${groupSize} people. ${constraints} Do not suggest any of these bars we already know: ${excludeNames.join(", ") || "none"}. Respond with ONLY raw JSON, no markdown fences, no commentary, in exactly this shape:
{"name":"string","neighborhood":"short neighborhood name","description":"two sentences covering vibe, price range ($ $$ $$$ $$$$), and location","tags":["3 to 5 short lowercase vibe words"],"happyHour":"short string or null","capacityHint":0,"address":"full street address, city, state"}`;
  try {
    const result = await callGemini(prompt, null, true);
    return (result && !Array.isArray(result)) ? result : null;
  } catch(e) { return null; }
}

// ---------- Form defaults ----------
const emptyVisitedForm = { id:null, name:"", vibe:"", value:"", service:"", food:"", drinks:"", bathroomBonus:"", notes:"" };
const emptyWishForm    = { id:null, name:"", neighborhood:"", notes:"" };

// ---------- App ----------
function App() {
  const [bars, setBars]                   = useState(null);
  const [groupSize, setGroupSizeState]    = useState(4);
  const [loading, setLoading]             = useState(true);
  const [connError, setConnError]         = useState(false);
  const [tab, setTab]                     = useState("leaderboard");
  const [search, setSearch]               = useState("");
  const [foodMode, setFoodMode]           = useState("with");
  const [showVisitedForm, setShowVisitedForm] = useState(false);
  const [visitedForm, setVisitedForm]     = useState(emptyVisitedForm);
  const [showWishForm, setShowWishForm]   = useState(false);
  const [wishForm, setWishForm]           = useState(emptyWishForm);
  const [saveError, setSaveError]         = useState(false);
  const [vibeQuery, setVibeQuery]         = useState("");
  const [fitsGroupOnly, setFitsGroupOnly] = useState(false);
  const [ballerMode, setBallerMode]       = useState(false);
  const [exploreMode, setExploreMode]     = useState(false);
  const [searchResults, setSearchResults] = useState([]);
  const [searching, setSearching]         = useState(false);
  const [searchDone, setSearchDone]       = useState(false);
  const [fetchingIds, setFetchingIds]     = useState(new Set());
  const [showInfo, setShowInfo]           = useState(false);
  const [visitedSuggestion, setVisitedSuggestion] = useState(null);
  const [osmModal, setOsmModal]           = useState(null);
  const [showVisitedNamePrompt, setShowVisitedNamePrompt] = useState(false);
  const [visitedNameInput, setVisitedNameInput] = useState("");

  const docRef = db.collection(DOC_PATH.collection).doc(DOC_PATH.doc);

  // Live sync from Firestore
  useEffect(() => {
    const unsub = docRef.onSnapshot((snap) => {
      if (snap.exists) {
        const data = snap.data();
        setBars(data.bars || []);
        if (data.groupSize) setGroupSizeState(data.groupSize);
      } else {
        docRef.set({ bars: seedBars, groupSize: 4 }).catch(() => setConnError(true));
        setBars(seedBars);
      }
      setLoading(false);
    }, (err) => { console.error(err); setConnError(true); setBars(seedBars); setLoading(false); });
    return () => unsub();
    // eslint-disable-next-line
  }, []);

  const persist = useCallback((next) => {
    setBars(next);
    return docRef.set({ bars: next }, { merge: true })
      .then(() => setSaveError(false))
      .catch(() => setSaveError(true));
    // eslint-disable-next-line
  }, []);

  const persistGroup = useCallback((n) => {
    setGroupSizeState(n);
    docRef.set({ groupSize: n }, { merge: true }).catch(() => {});
    // eslint-disable-next-line
  }, []);

  const updateBar = useCallback((id, patch) => {
    setBars((prev) => {
      const next = prev.map(b => b.id === id ? { ...b, ...patch } : b);
      docRef.set({ bars: next }, { merge: true }).catch(() => setSaveError(true));
      return next;
    });
    // eslint-disable-next-line
  }, []);

  const runDetailsFetch = useCallback((bar, forceRefresh) => {
    setFetchingIds(s => new Set(s).add(bar.id));
    const prompt = `You are a NYC bar description writer.\n\nThe bar "${bar.name}" located at "${bar.address || bar.neighborhood || "New York City"}" has already been verified as a real business.\n\nUsing only what you know about this specific venue, return ONLY JSON:\n\n{"description":"two to three sentences covering vibe, drink style, and notable characteristics","tags":["3 to 5 short lowercase vibe words"],"happyHour":"short string or null","neighborhood":"short neighborhood name","capacityHint":0}\n\nRules:\n- Do NOT invent or rename the business.\n- If you have no reliable information, set description to an empty string.\n- Do not include a mapsLink field.`;
    callGemini(prompt, bar.id, forceRefresh).then((data) => {
      const patch = data ? { ...data, detailsFetched: true } : null;
      if (patch) updateBar(bar.id, patch);
      setFetchingIds(s => { const n = new Set(s); n.delete(bar.id); return n; });
    });
  }, [updateBar]);

  // Auto-fetch details for bars that haven't been fetched yet
  useEffect(() => {
    if (!bars) return;
    bars.forEach(bar => {
      if (!bar.detailsFetched && !fetchingIds.has(bar.id)) runDetailsFetch(bar);
    });
    // eslint-disable-next-line
  }, [bars]);

  function startManualAdd(type) {
    if (type === "visited") {
      // Show a quick name entry first, then go through OSM
      setVisitedSuggestion(null);
      setVisitedForm(emptyVisitedForm);
      setShowVisitedNamePrompt(true);
    } else {
      setWishForm(emptyWishForm);
      setShowWishForm(true);
    }
  }

  async function startOsmLookup(suggestion) {
    setOsmModal({ suggestion, results: [], searching: true });
    try {
      const response = await fetch("/api/search-bar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: suggestion.name, neighborhood: suggestion.neighborhood || "" }),
      });
      const results = await response.json();
      const osmResults = Array.isArray(results) ? results : [];
      if (osmResults.length > 0) {
        setOsmModal({ suggestion, results: osmResults, searching: false });
        return;
      }
      // OSM found nothing — fall back to Gemini for location data
      const geminiGeo = await geocodeWithGemini(suggestion);
      if (geminiGeo) {
        setOsmModal({ suggestion, results: [geminiGeo], searching: false, fromGemini: true });
      } else {
        setOsmModal({ suggestion, results: [], searching: false });
      }
    } catch(e) {
      // On error, try Gemini as last resort
      try {
        const geminiGeo = await geocodeWithGemini(suggestion);
        if (geminiGeo) {
          setOsmModal({ suggestion, results: [geminiGeo], searching: false, fromGemini: true });
          return;
        }
      } catch(e2) { /* ignore */ }
      setOsmModal({ suggestion, results: [], searching: false });
    }
  }

  async function geocodeWithGemini(suggestion) {
    const prompt = `You are a geocoding assistant. Find the exact street address and coordinates for "${suggestion.name}" ${suggestion.neighborhood ? "in " + suggestion.neighborhood + ", " : "in "}New York City, NY. Respond with ONLY raw JSON, no markdown fences: {"address":"full street address, city, state, zip","latitude":40.7,"longitude":-74.0,"name":"verified business name"}`;
    const result = await callGemini(prompt, null, true);
    if (!result) return null;
    const address = result.address || suggestion.address || "";
    const lat = result.latitude || null;
    const lng = result.longitude || null;
    // Build mapsLink using bar name + NYC so Google Maps finds the actual business listing
    const mapsLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((result.name || suggestion.name) + ", New York City")}`;
    return {
      name: result.name || suggestion.name,
      address,
      latitude: lat,
      longitude: lng,
      mapsLink,
      _fromGemini: true,
    };
  }

  function confirmOsmSelection(osmResult) {
    const merged = { ...osmModal.suggestion, ...osmResult };
    // Preserve Gemini-provided description/tags if OSM result overwrote them
    if (osmResult._fromGemini || Object.keys(osmResult).length === 0) {
      // These fields should already be in osmModal.suggestion — ensure they survive
      merged.description = osmModal.suggestion.description || merged.description || "";
      merged.tags = osmModal.suggestion.tags || merged.tags || [];
      merged.neighborhood = osmModal.suggestion.neighborhood || merged.neighborhood || "";
      merged.happyHour = osmModal.suggestion.happyHour || merged.happyHour || "";
      merged.capacityHint = osmModal.suggestion.capacityHint || merged.capacityHint || null;
    }
    if (osmModal.suggestion._osmIntent === "visited") {
      // Pre-fill the visited scoring form with verified location data
      setVisitedSuggestion(merged);
      setVisitedForm({ ...emptyVisitedForm, name: merged.name });
      setOsmModal(null);
      setShowVisitedForm(true);
    } else {
      addSuggestionToWishlist(merged);
      setWishForm(emptyWishForm);
      setOsmModal(null);
    }
  }
  const visited = useMemo(() => (bars || []).filter(b => b.status === "visited"), [bars]);
  const toTry   = useMemo(() => (bars || []).filter(b => b.status === "to-try"),  [bars]);

  const filteredVisited = useMemo(() => {
    const q = search.trim().toLowerCase();
    let list = visited.filter(b => {
      if (!q) return true;
      return b.name.toLowerCase().includes(q)
        || (b.notes || "").toLowerCase().includes(q)
        || (b.tags || []).some(t => t.toLowerCase().includes(q));
    });
    list.sort((a, b) => {
      if (!!a.disqualified !== !!b.disqualified) return a.disqualified ? 1 : -1;
      const av = foodMode === "with" ? avgWithFood(a) : avgWithoutFood(a);
      const bv = foodMode === "with" ? avgWithFood(b) : avgWithoutFood(b);
      return (bv || 0) - (av || 0);
    });
    return list;
  }, [visited, search, foodMode]);

  const filteredToTry = useMemo(() => {
    return toTry.filter(b => {
      if (fitsGroupOnly && b.capacity && Number(b.capacity) < groupSize) return false;
      return true;
    });
  }, [toTry, fitsGroupOnly, groupSize]);

  async function runSearch() {
    setSearchResults([]); setSearching(true); setSearchDone(false);
    const exclude = (bars || []).map(b => b.name);
    const results = await fetchBarSuggestions(vibeQuery, groupSize, exclude, ballerMode, exploreMode);
    const filtered = fitsGroupOnly ? results.filter(r => !r.capacityHint || r.capacityHint >= groupSize) : results;
    setSearchResults(filtered); setSearching(false); setSearchDone(true);
  }

  async function runRandomSearch() {
    setSearchResults([]); setSearching(true); setSearchDone(false);
    const exclude = (bars || []).map(b => b.name);
    const pick = await fetchRandomBar(groupSize, exclude, ballerMode, exploreMode);
    setSearchResults(pick ? [pick] : []); setSearching(false); setSearchDone(true);
  }

  function addSuggestionToWishlist(s) {
    // Use bar name + NYC so Google Maps finds the business listing, not just a street address
    const mapsLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name + ", New York City")}`;
    const isEdit = s._wishFormId;
    const id = isEdit ? s._wishFormId : `b${Date.now()}`;
    // If Gemini already gave us a real description, don't re-fetch and overwrite it
    const hasDescription = typeof s.description === "string" && s.description.trim().length > 10;
    const record = {
      id,
      name: s.name,
      status: "to-try",
      vibe: null, value: null, service: null, food: null, drinks: null, bathroomBonus: 0,
      notes: s.notes || "",
      neighborhood: s.neighborhood || "",
      description: s.description || "",
      tags: s.tags || [],
      happyHour: s.happyHour || "",
      capacity: s.capacityHint || null,
      address: s.address || "",
      latitude: s.latitude || null,
      longitude: s.longitude || null,
      mapsLink,
      detailsFetched: hasDescription,
    };
    if (isEdit) {
      persist((bars || []).map(b => b.id === id ? { ...b, ...record } : b));
    } else {
      persist([...(bars || []), record]);
    }
    setSearchResults(prev => prev.filter(r => r.name !== s.name));
  }

  async function startVerifiedWishlistAdd(s) {
    await startOsmLookup({ ...s, _osmIntent: "wishlist" });
  }

  function rankSuggestion(s) {
    setVisitedSuggestion(s);
    setVisitedForm({ ...emptyVisitedForm, name: s.name });
    setShowVisitedForm(true);
  }

  async function saveVisitedForm(e) {
    e.preventDefault();
    if (!visitedForm.name.trim()) return;
    const cleanNum = v => (v === "" || v === null ? null : Number(v));
    const isNew = !visitedForm.id;
    const id = visitedForm.id || `b${Date.now()}`;
    const patch = {
      name: visitedForm.name.trim(), status: "visited",
      vibe: cleanNum(visitedForm.vibe), value: cleanNum(visitedForm.value),
      service: cleanNum(visitedForm.service), food: cleanNum(visitedForm.food),
      drinks: cleanNum(visitedForm.drinks),
      bathroomBonus: cleanNum(visitedForm.bathroomBonus) || 0,
      notes: visitedForm.notes.trim(),
    };
    let next, record;
    if (isNew) {
      const mapsLink = visitedSuggestion
        ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(visitedSuggestion.name + ", New York City")}`
